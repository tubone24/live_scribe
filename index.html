<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2023" media="(prefers-color-scheme: dark)">
<title>Live Scribe</title>
<style>
:root {
  --page: oklch(98.5% .001 286); --surface: oklch(100% 0 0); --inset: oklch(97.9% .002 248);
  --hover: oklch(96% .002 248); --field: oklch(96.1% .001 286);
  --ink: oklch(24.7% .006 258); --ink-2: oklch(50.6% .01 264); --ink-3: oklch(69.5% .009 264);
  --line: oklch(94.6% .003 264); --line-strong: oklch(91.2% .005 258);
  --accent: oklch(62.6% .205 255); --accent-tint: oklch(96% .019 253);
  --green: oklch(60.3% .155 151); --green-tint: oklch(95.8% .017 159);
  --orange: oklch(68.9% .179 50); --orange-tint: oklch(96.4% .021 68);
  --red: oklch(62.1% .192 23); --red-tint: oklch(95.6% .017 17);
  --tip-bg: oklch(27.2% .008 264); --tip-fg: oklch(97.6% .002 248);
  --shadow-btn: 0 0 0 1px var(--line-strong), 0 1px 2px oklch(0% 0 0 / .05);
  --shadow-card: 0 0 0 1px var(--line), 0 1px 2px oklch(0% 0 0 / .04), 0 4px 16px oklch(0% 0 0 / .06);
  --shadow-overlay: 0 0 0 1px var(--line), 0 12px 40px oklch(0% 0 0 / .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: oklch(20.9% .004 264); --surface: oklch(26% .006 271); --inset: oklch(24.3% .004 264);
    --hover: oklch(28.9% .006 271); --field: oklch(29.3% .006 271);
    --ink: oklch(96.4% .002 248); --ink-2: oklch(73.1% .008 261); --ink-3: oklch(54.1% .01 264);
    --line: oklch(30.8% .006 258); --line-strong: oklch(35.6% .007 264);
    --accent: oklch(68% .173 253); --accent-tint: oklch(68% .173 253 / .16);
    --green: oklch(70.5% .154 154); --green-tint: oklch(70.5% .154 154 / .14);
    --orange: oklch(74.6% .156 56); --orange-tint: oklch(74.6% .156 56 / .14);
    --red: oklch(66.6% .18 21); --red-tint: oklch(66.6% .18 21 / .14);
    --tip-bg: oklch(18.2% .004 264); --tip-fg: oklch(96.4% .002 248);
    --shadow-btn: 0 0 0 1px oklch(100% 0 0 / .1), 0 1px 2px oklch(0% 0 0 / .3);
    --shadow-card: 0 0 0 1px oklch(100% 0 0 / .11), 0 1px 2px oklch(0% 0 0 / .2), 0 4px 16px oklch(0% 0 0 / .25);
    --shadow-overlay: 0 0 0 1px oklch(100% 0 0 / .15), 0 12px 40px oklch(0% 0 0 / .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 14px; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
svg { display: block; flex: none; }
:focus:not(:focus-visible) { outline: none; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  border-bottom: 1px dashed var(--line-strong);
}
.pix { display: grid; grid-template-columns: repeat(3, 3px); gap: 1.5px; color: var(--ink-3); }
.pix i { width: 3px; height: 3px; border-radius: .5px; background: currentColor; opacity: .35; }
.live .pix { color: var(--red); }
.live .pix i { animation: pix 1.1s infinite; animation-delay: calc(var(--d) * 85ms); }
@keyframes pix { 0%, 100% { opacity: .2; } 35% { opacity: 1; } }
#stateLabel { font-weight: 500; color: var(--ink-2); }
#elapsed { font-size: 12px; color: var(--ink-3); }
.shimmer {
  background: linear-gradient(90deg, var(--ink-3) 0 35%, var(--ink) 50%, var(--ink-3) 65% 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important;
  animation: shim 2.2s linear infinite;
}
@keyframes shim { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
#wl { margin-left: auto; }
#wl.ok { background: var(--green-tint); color: var(--green); }
#wl.ng { background: var(--orange-tint); color: var(--orange); }
#wl:empty { display: none; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2);
}
.icon-btn:active { background: var(--hover); }
#menuBtn { margin-left: auto; }
#wl:not(:empty) + #menuBtn { margin-left: 0; }

/* ---------- transcript ---------- */
main { flex: 1; overflow-y: auto; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
#banner {
  display: none; margin: 8px 0; padding: 10px 12px; border-radius: 10px;
  background: var(--orange-tint); color: var(--orange); font-size: 13px; line-height: 1.6;
}
#banner.show { display: block; }
.empty { margin-top: 26vh; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--ink-3); text-align: center; line-height: 1.7; }
.empty .pix { grid-template-columns: repeat(3, 5px); gap: 2.5px; }
.empty .pix i { width: 5px; height: 5px; border-radius: 1px; }
.empty b { color: var(--ink-2); font-weight: 500; }
.seg {
  display: grid; grid-template-columns: 44px 1fr 28px; align-items: start;
  padding: 7px 8px; margin: 0 -8px; border-radius: 10px;
  font-size: 16.5px; line-height: 1.75; animation: segIn .35s ease-out;
}
@keyframes segIn { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } }
.seg .time { font-size: 11px; color: var(--ink-3); padding-top: 5px; }
.seg .txt { word-break: break-word; }
.seg .star { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink-3); opacity: .35; margin-top: -1px; }
.seg.starred { background: var(--orange-tint); }
.seg.starred .star { color: var(--orange); opacity: 1; }
.seg.starred .star path { fill: currentColor; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; margin-right: 6px;
  border-radius: 6px; background: var(--accent-tint); color: var(--accent); font-size: 11px; font-weight: 600;
  vertical-align: 2px;
}
.seg.note .txt { color: var(--ink); font-weight: 500; }
#interim {
  display: grid; grid-template-columns: 44px 1fr; font-size: 16.5px; line-height: 1.75; padding: 7px 0;
}
#interim:empty { display: none; }
#interim .txt { color: var(--ink-3); }
.divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--line-strong); }
.divider span {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px;
  background: var(--green-tint); color: var(--green); font-size: 11px; font-weight: 600;
}

#toBottom {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 136px);
  display: none; align-items: center; gap: 4px; height: 30px; padding: 0 12px; border-radius: 999px;
  background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 500; box-shadow: var(--shadow-card);
}
#toBottom.show { display: inline-flex; }

/* ---------- dock (prompt bar) ---------- */
footer { padding: 0 12px calc(env(safe-area-inset-bottom) + 10px); }
.dock { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-card); padding: 6px; }
.note-row { display: flex; align-items: center; gap: 6px; padding: 2px 2px 2px 10px; }
#noteInput {
  flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: none; color: var(--ink);
  font: inherit; font-size: 16px;
}
#noteInput::placeholder { color: var(--ink-3); }
#noteAdd {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--surface); transition: opacity .15s;
}
#noteAdd:disabled { opacity: .18; }
.actions { display: flex; align-items: center; gap: 6px; padding: 4px 2px 2px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px;
  border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-btn); background: var(--surface);
  transition: transform .1s, background .15s;
}
.pill:active { transform: scale(.97); }
#recBtn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
#recBtn.running { background: var(--red-tint); color: var(--red); box-shadow: 0 0 0 1px color-mix(in oklch, var(--red) 35%, transparent); }
#recBtn.running .dot { border-radius: 2px; }
#starBtn { width: 40px; padding: 0; color: var(--orange); }
#sendBtn { margin-left: auto; background: var(--accent); color: #fff; box-shadow: none; padding: 0 8px 0 14px; }
#sendBtn .count {
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
  background: oklch(100% 0 0 / .22); font-size: 11px;
}
#sendBtn:disabled { background: var(--field); color: var(--ink-3); }
#sendBtn:disabled .count { background: var(--line-strong); }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 62px); transform: translate(-50%, -6px);
  display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px);
  background: var(--tip-bg); color: var(--tip-fg); padding: 9px 14px; border-radius: 12px; font-size: 13px;
  box-shadow: var(--shadow-overlay); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- settings sheet ---------- */
dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px;
  background: var(--surface); color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-overlay);
}
dialog[open] { animation: sheetIn .25s ease-out; }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } }
dialog::backdrop { background: oklch(0% 0 0 / .4); backdrop-filter: blur(2px); }
.sheet { padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92dvh; overflow-y: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.label { font-size: 12px; color: var(--ink-2); margin: 4px 2px 6px; display: block; }
.label .link { float: right; color: var(--accent); font-size: 12px; }
.sheet textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 0;
  background: var(--field); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.6;
  box-shadow: inset 0 1px 2px oklch(0% 0 0 / .08); outline: 0;
}
.menu { margin-top: 14px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.menu button {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; text-align: left; font-size: 14px;
}
.menu button + button { border-top: 1px solid var(--line); }
.menu button:active { background: var(--hover); }
.menu button svg { color: var(--ink-2); }
.menu .danger, .menu .danger svg { color: var(--red); }
.hint { font-size: 12px; color: var(--ink-3); margin: 14px 2px 0; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header id="head">
  <span class="pix" aria-hidden="true">
    <i style="--d:0"></i><i style="--d:1"></i><i style="--d:2"></i>
    <i style="--d:7"></i><i style="--d:8"></i><i style="--d:3"></i>
    <i style="--d:6"></i><i style="--d:5"></i><i style="--d:4"></i>
  </span>
  <span id="stateLabel">待機中</span>
  <span id="elapsed" class="mono"></span>
  <span id="wl" class="chip"></span>
  <button class="icon-btn" id="menuBtn" aria-label="設定">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main id="log">
  <div id="banner"></div>
  <div class="empty" id="empty">
    <span class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <div><b>録音を始めると、ここに文字が流れます</b><br>音声は保存せず、テキストもこの端末内だけに残ります</div>
  </div>
  <div id="segs"></div>
  <div id="interim"></div>
</main>
<button id="toBottom">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>最新へ
</button>

<footer>
  <div class="dock">
    <div class="note-row">
      <input id="noteInput" placeholder="手入力メモを追加…（例：SSO必須）" enterkeyhint="done" autocomplete="off">
      <button id="noteAdd" aria-label="メモを追加" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <div class="actions">
      <button class="pill" id="recBtn"><span class="dot"></span><span id="recLabel">録音開始</span></button>
      <button class="pill" id="starBtn" aria-label="直前の発言を重要にする">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      </button>
      <button class="pill" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3-3 3 3"/></svg>
        送る<span class="count mono" id="sendCount">0</span>
      </button>
    </div>
  </div>
</footer>

<div id="toast"></div>

<dialog id="dlg">
  <div class="sheet">
    <div class="sheet-head">
      <h2 tabindex="-1" autofocus>設定</h2>
      <button class="icon-btn" id="closeDlg" aria-label="閉じる">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="label" for="contextInput">商談のコンテキスト（任意・誤変換の補正に使われます）</label>
    <textarea id="contextInput" placeholder="例：〇〇社 情報システム部。テーマは経費精算のワークフロー化。固有名詞：SmartFlow、Entra ID"></textarea>
    <label class="label" for="instrInput" style="margin-top:12px">Claude への指示（ファイル末尾に付きます）<button id="resetInstr" class="link">既定に戻す</button></label>
    <textarea id="instrInput" style="min-height:140px"></textarea>
    <div class="menu">
      <button id="downloadAll">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg>
        全文をダウンロード
      </button>
      <button id="shareAll">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        全文を共有シートで送る
      </button>
      <button id="newSession" class="danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        新しい商談を始める（端末内のデータを削除）
      </button>
    </div>
    <p class="hint">「送る」は前回以降の差分を .txt ファイルとしてダウンロードします。「ファイル」アプリ &gt; ダウンロード からファイルを開き、共有で Slack に送ってください。<br>音声は保存しません。テキストはこの端末のブラウザ内にのみ保存されます。文字起こしはブラウザ標準の音声認識（iOS では Apple）を利用します。</p>
  </div>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const KEY = 'livescribe.v1';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const STAR_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';

  // ---------- state ----------
  const DEFAULT_INSTR = [
    '上の meeting_transcript は、顧客との商談中に録った文字起こしです。私はこの内容をもとに、その場でプロトタイプを作って顧客とすり合わせます。',
    '',
    '読み方の注意：',
    '- transcript は音声認識の生テキストです。同音異義語や固有名詞の誤認識、句読点の欠落があります。context の固有名詞を手がかりに補正してください。',
    '- 話者は区別されていません（顧客と私の発言が混在）。文脈から推測し、どちらの発言か曖昧で結論が変わる箇所は「要確認」としてください。',
    '- notes は私が手入力したメモで確度が高い情報、important は私が重要マークを付けた発言です。優先して扱ってください。',
    '- part 属性が 2 以上のときは続きです。それまでのパートの内容と統合してください。',
    '',
    '以下を日本語で整理・更新してください（書かれていないことは推測で埋めず「未確認」とする）：',
    '1. 顧客の課題・背景',
    '2. やりたいこと・要件（必須／あれば良い）',
    '3. 制約（技術・セキュリティ・予算・期限・既存システム）',
    '4. プロトタイプで作るべき画面・機能（優先度順）',
    '5. 未確認事項と、次に顧客へ聞くべき質問',
  ].join('\n');
  const fresh = (keep = {}) => ({
    segs: [], sentUpTo: 0, sendCount: 0, startedAt: null, context: keep.context || '', instr: keep.instr ?? null,
  });
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
  S.context ??= S.prefix || ''; S.instr ??= null; delete S.prefix;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- UI helpers ----------
  const log = $('#log'), segsEl = $('#segs'), interimEl = $('#interim');
  let toastTimer;
  const toast = (msg) => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  };
  const banner = (msg) => { const b = $('#banner'); b.textContent = msg || ''; b.classList.toggle('show', !!msg); };

  const nearBottom = () => log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  const scrollBottom = () => { log.scrollTop = log.scrollHeight; };
  log.addEventListener('scroll', () => $('#toBottom').classList.toggle('show', !nearBottom()));
  $('#toBottom').onclick = scrollBottom;

  const segHTML = (seg, i) =>
    `<div class="seg${seg.kind === 'note' ? ' note' : ''}${seg.star ? ' starred' : ''}" data-i="${i}">` +
    `<span class="time mono">${fmt(seg.ts)}</span>` +
    `<span class="txt">${seg.kind === 'note' ? '<span class="tag">メモ</span>' : ''}${esc(seg.text)}</span>` +
    `<button class="star" data-act="star" aria-label="重要">${STAR_SVG}</button></div>`;
  const dividerHTML = () => `<div class="divider"><span>送信済み #${S.sendCount}</span></div>`;

  const renderAll = () => {
    const keep = nearBottom();
    let html = '';
    S.segs.forEach((seg, i) => {
      if (i === S.sentUpTo && S.sendCount > 0) html += dividerHTML();
      html += segHTML(seg, i);
    });
    if (S.sentUpTo === S.segs.length && S.sendCount > 0) html += dividerHTML();
    segsEl.innerHTML = html;
    segsEl.querySelectorAll('.seg').forEach((el) => { el.style.animation = 'none'; });
    $('#empty').style.display = S.segs.length ? 'none' : '';
    updSend();
    if (keep) scrollBottom();
  };
  const renderOne = (i) => {
    const el = segsEl.querySelector(`.seg[data-i="${i}"]`);
    if (!el) return;
    el.outerHTML = segHTML(S.segs[i], i);
    segsEl.querySelector(`.seg[data-i="${i}"]`).style.animation = 'none';
  };
  const appendSeg = (seg) => {
    const keep = nearBottom();
    S.segs.push(seg); save();
    segsEl.insertAdjacentHTML('beforeend', segHTML(seg, S.segs.length - 1));
    $('#empty').style.display = 'none';
    updSend();
    if (keep) scrollBottom();
  };
  const updSend = () => {
    const n = S.segs.length - S.sentUpTo;
    $('#sendCount').textContent = n;
    $('#sendBtn').disabled = n === 0;
  };

  segsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act="star"]'); if (!btn) return;
    const i = +btn.closest('.seg').dataset.i;
    S.segs[i].star = !S.segs[i].star;
    save(); renderOne(i);
  });

  $('#starBtn').onclick = () => {
    const i = S.segs.length - 1;
    if (i < 0) return toast('まだ発言がありません');
    S.segs[i].star = true; save(); renderOne(i); toast('直前の発言を重要にしました');
  };
  const noteInput = $('#noteInput');
  noteInput.addEventListener('input', () => { $('#noteAdd').disabled = !noteInput.value.trim(); });
  const addNote = () => {
    const v = noteInput.value.trim(); if (!v) return;
    appendSeg({ kind: 'note', ts: Date.now(), text: v, star: false });
    noteInput.value = ''; $('#noteAdd').disabled = true;
    scrollBottom();
  };
  $('#noteAdd').onclick = addNote;
  noteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addNote(); });

  // ---------- wake lock (画面を点けっぱなしにする) ----------
  let wakeLock = null;
  const updWL = () => {
    const el = $('#wl');
    el.className = 'chip';
    if (!running) { el.textContent = ''; return; }
    if (!('wakeLock' in navigator)) { el.textContent = '常時点灯 非対応'; el.classList.add('ng'); }
    else if (wakeLock) { el.textContent = '画面常時点灯'; el.classList.add('ok'); }
    else el.textContent = '';
  };
  const lockOn = async () => {
    if (!('wakeLock' in navigator) || wakeLock) return updWL();
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; updWL(); });
    } catch {}
    updWL();
  };
  const lockOff = async () => { try { await wakeLock?.release(); } catch {} wakeLock = null; updWL(); };

  // ---------- speech recognition ----------
  let running = false, rec = null, errStreak = 0, timer = null;
  let lastSegIdxThisRec = -1;

  const commit = (text) => {
    text = text.trim(); if (!text) return;
    // iOS は continuous 時に「前回の確定文＋続き」を返すことがあるので重複を吸収する
    const prev = S.segs[lastSegIdxThisRec];
    if (prev && prev.kind !== 'note') {
      if (text.startsWith(prev.text)) { prev.text = text; save(); renderOne(lastSegIdxThisRec); return; }
      if (prev.text.startsWith(text)) return;
    }
    appendSeg({ ts: Date.now(), text, star: false });
    lastSegIdxThisRec = S.segs.length - 1;
  };

  const setInterim = (text) => {
    const keep = nearBottom();
    interimEl.innerHTML = text ? `<span></span><span class="txt shimmer">${esc(text)}</span>` : '';
    if (keep) scrollBottom();
  };

  const startRec = () => {
    if (!running) return;
    const r = new SR();
    r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
    const done = new Set();
    let interim = '';
    lastSegIdxThisRec = -1;
    r.onresult = (e) => {
      errStreak = 0; interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i], t = res[0].transcript;
        if (res.isFinal) { if (!done.has(i)) { done.add(i); commit(t); } }
        else interim += t;
      }
      setInterim(interim);
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        banner('マイクまたは音声認識が許可されていません。設定 > Safari > マイク、および 設定 > Siri（音声入力）を確認してください。');
        stop();
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        errStreak++;
      }
    };
    r.onend = () => {
      if (interim) { commit(interim); interim = ''; }
      setInterim('');
      if (rec === r) rec = null;
      if (running && document.visibilityState === 'visible') {
        if (errStreak >= 5) banner('音声認識が不安定です（ネットワークを確認してください）。自動で再試行しています…');
        setTimeout(startRec, Math.min(200 * 2 ** Math.max(0, errStreak - 1), 5000));
      }
    };
    try { r.start(); rec = r; } catch { setTimeout(startRec, 500); }
  };

  const tick = () => {
    const label = $('#stateLabel');
    label.textContent = running ? '録音中' : S.startedAt ? '一時停止' : '待機中';
    label.classList.toggle('shimmer', running);
    $('#head').classList.toggle('live', running);
    if (!S.startedAt) { $('#elapsed').textContent = ''; return; }
    const s = Math.floor((Date.now() - S.startedAt) / 1000), hh = Math.floor(s / 3600);
    $('#elapsed').textContent = (hh ? `${hh}:` : '') + `${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  };

  const start = () => {
    if (!SR) return banner('このブラウザは音声認識に対応していません。iPhone の Safari で開いてください。');
    banner('');
    running = true; errStreak = 0;
    if (!S.startedAt) { S.startedAt = Date.now(); save(); }
    $('#recLabel').textContent = '停止'; $('#recBtn').classList.add('running');
    lockOn(); startRec();
    clearInterval(timer); timer = setInterval(tick, 1000); tick();
  };
  function stop() {
    running = false;
    try { rec?.stop(); } catch {}
    $('#recLabel').textContent = '録音再開'; $('#recBtn').classList.remove('running');
    lockOff(); clearInterval(timer); tick();
  }
  $('#recBtn').onclick = () => (running ? stop() : start());

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      lockOn();
      if (!rec) startRec();
    }
  });

  // ---------- export (ファイルとして共有 / ダウンロード) ----------
  // LLM 向けの出力：データを XML タグで区切り、指示は末尾に置く
  const sessionId = () => {
    const d = new Date(S.startedAt || Date.now());
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  };
  const xmlEsc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const buildText = (from, to, part) => {
    const segs = S.segs.slice(from, to);
    if (!segs.length) return '';
    const speech = segs.filter((s) => s.kind !== 'note');
    const notes = segs.filter((s) => s.kind === 'note');
    const important = speech.filter((s) => s.star);

    // 近い時刻の発言は1行にまとめて読みやすくする（★付きは単独行のまま）
    const lines = [];
    let cur = null;
    const flush = () => { if (cur) lines.push(`[${fmt(cur.ts)}]${cur.star ? ' ★' : ''} ${xmlEsc(cur.text)}`); cur = null; };
    for (const seg of speech) {
      if (cur && !cur.star && !seg.star && seg.ts - cur.last < 30000) { cur.text += ' ' + seg.text; cur.last = seg.ts; }
      else { flush(); cur = { ...seg, last: seg.ts }; }
    }
    flush();

    const d = new Date(S.startedAt || segs[0].ts);
    const attrs = [
      `session="${sessionId()}"`,
      `date="${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}"`,
      `part="${part}"`,
      `range="${fmt(segs[0].ts)}-${fmt(segs[segs.length - 1].ts)}"`,
    ].join(' ');
    const list = (items) => items.map((s) => `- [${fmt(s.ts)}] ${xmlEsc(s.text)}`).join('\n');
    const instr = (S.instr ?? DEFAULT_INSTR).trim();
    return [
      `<meeting_transcript ${attrs}>`,
      S.context.trim() && `<context>\n${xmlEsc(S.context.trim())}\n</context>`,
      notes.length && `<notes description="私が手入力したメモ。確度が高い">\n${list(notes)}\n</notes>`,
      important.length && `<important description="私が重要マークを付けた発言（音声認識）">\n${list(important)}\n</important>`,
      speech.length && `<transcript description="音声認識の生テキスト。誤認識あり・話者の区別なし。★は重要マーク">\n${lines.join('\n')}\n</transcript>`,
      '</meeting_transcript>',
      instr && `<instructions>\n${instr}\n</instructions>`,
    ].filter(Boolean).join('\n\n') + '\n';
  };

  const fileName = (suffix) => `live-scribe_${sessionId()}_${suffix}.txt`;

  const download = (file) => {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };

  // 共有シート（Slack を選ぶとファイルとしてアップロード）。使えなければダウンロード
  const exportFile = async (text, name) => {
    const file = new File([text], name, { type: 'text/plain' });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return 'shared'; }
      catch (e) { if (e.name === 'AbortError') return null; }
    }
    download(file);
    return 'downloaded';
  };

  // 「送る」は共有シートを使わず直接ダウンロード（ファイルアプリ経由で Slack に共有する運用）
  $('#sendBtn').onclick = () => {
    const to = S.segs.length, n = S.sendCount + 1;
    const text = buildText(S.sentUpTo, to, n);
    if (!text) return toast('新しい内容はありません');
    download(new File([text], fileName(`part${pad(n)}`), { type: 'text/plain' }));
    S.sentUpTo = to; S.sendCount = n; save(); renderAll(); scrollBottom();
    toast(`パート${n} を保存しました。ファイルアプリ > ダウンロード から共有してください`);
  };

  // ---------- settings ----------
  const dlg = $('#dlg');
  $('#menuBtn').onclick = () => {
    $('#contextInput').value = S.context;
    $('#instrInput').value = S.instr ?? DEFAULT_INSTR;
    dlg.showModal();
  };
  $('#closeDlg').onclick = () => dlg.close();
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  $('#contextInput').addEventListener('input', (e) => { S.context = e.target.value; save(); });
  $('#instrInput').addEventListener('input', (e) => { S.instr = e.target.value === DEFAULT_INSTR ? null : e.target.value; save(); });
  $('#resetInstr').onclick = (e) => { e.preventDefault(); S.instr = null; save(); $('#instrInput').value = DEFAULT_INSTR; toast('指示を既定に戻しました'); };
  $('#shareAll').onclick = async () => {
    const text = buildText(0, S.segs.length, 'all');
    if (!text) return toast('内容がありません');
    await exportFile(text, fileName('full'));
  };
  $('#downloadAll').onclick = () => {
    const text = buildText(0, S.segs.length, 'all');
    if (!text) return toast('内容がありません');
    download(new File([text], fileName('full'), { type: 'text/plain' }));
  };
  $('#newSession').onclick = () => {
    if (!confirm('現在の文字起こしを端末から削除して、新しい商談を始めますか？')) return;
    if (running) stop();
    S = fresh({ instr: S.instr });
    save(); renderAll(); setInterim('');
    $('#recLabel').textContent = '録音開始'; tick();
    dlg.close(); toast('新しい商談を開始できます');
  };

  // ---------- init ----------
  if (!SR) banner('このブラウザは音声認識に対応していません。iPhone の Safari で開いてください。');
  if (S.segs.length) $('#recLabel').textContent = '録音再開';
  tick(); renderAll(); updWL();
})();
</script>
</body>
</html>

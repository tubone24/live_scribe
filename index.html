<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>Live Scribe</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #15181c; --muted: #6b7280; --line: #e3e6ea;
  --accent: #2563eb; --accent-fg: #fff; --rec: #dc2626; --star: #d97706; --note: #0f766e;
  --interim: #9aa1ab; --sent: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --panel: #181b1f; --fg: #e8eaed; --muted: #9aa1ab; --line: #2a2f35;
    --accent: #3b82f6; --accent-fg: #fff; --rec: #ef4444; --star: #f59e0b; --note: #2dd4bf;
    --interim: #6b7280; --sent: #22c55e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

header {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--rec); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
#status { font-weight: 600; font-variant-numeric: tabular-nums; }
#wl { font-size: 12px; color: var(--muted); margin-left: auto; }
#menuBtn { font-size: 22px; padding: 4px 6px; }

#banner { display: none; padding: 10px 16px; background: #fef3c7; color: #78350f; font-size: 14px; }
#banner.show { display: block; }

main { flex: 1; overflow-y: auto; padding: 12px 16px 24px; -webkit-overflow-scrolling: touch; }
.empty { color: var(--muted); text-align: center; margin-top: 30vh; line-height: 1.8; }
.seg { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; line-height: 1.7; font-size: 17px; }
.seg .spk {
  flex: none; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-top: 3px;
  background: var(--line); white-space: nowrap; min-width: 64px; text-align: center;
}
.seg .spk.s0 { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.seg .spk.s1 { background: color-mix(in srgb, var(--sent) 18%, transparent); color: var(--sent); }
.seg .spk.s2 { background: color-mix(in srgb, var(--star) 18%, transparent); color: var(--star); }
.seg .txt { flex: 1; word-break: break-word; }
.seg .time { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
.seg .star { flex: none; font-size: 18px; color: var(--line); padding: 0 2px; }
.seg.starred .star { color: var(--star); }
.seg.starred .txt { font-weight: 600; }
.seg.note .txt { color: var(--note); }
#interim { color: var(--interim); font-size: 17px; line-height: 1.7; padding: 6px 0; min-height: 1.7em; }
#interim:not(:empty)::after { content: "▍"; animation: pulse 1s infinite; }
.divider {
  display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 12px; color: var(--sent);
}
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--sent); }

#toBottom {
  position: fixed; right: 16px; bottom: 210px; display: none;
  background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 8px 14px;
  font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
#toBottom.show { display: block; }

footer {
  background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
  display: flex; flex-direction: column; gap: 10px;
}
.row { display: flex; gap: 8px; align-items: center; }
#speakers { display: flex; flex: 1; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
#speakers button { flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 15px; color: var(--muted); }
#speakers button.active { background: var(--panel); color: var(--fg); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.icon-btn { width: 46px; height: 42px; border-radius: 10px; background: var(--bg); font-size: 20px; flex: none; }
#starBtn { color: var(--star); }
#noteRow { display: none; }
#noteRow.show { display: flex; }
#noteInput {
  flex: 1; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0;
}
.btn { padding: 9px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
#recBtn {
  flex: 1; height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700;
  background: var(--rec); color: #fff;
}
#recBtn.running { background: var(--bg); color: var(--rec); border: 2px solid var(--rec); }
#sendBtn {
  flex: 1; height: 56px; border-radius: 14px; font-size: 16px; font-weight: 700;
  background: var(--accent); color: var(--accent-fg); line-height: 1.2;
}
#sendBtn small { display: block; font-size: 11px; font-weight: 500; opacity: .85; }
#sendBtn:disabled { opacity: .45; }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; }

dialog {
  border: 0; border-radius: 16px; padding: 20px; width: min(520px, calc(100% - 32px));
  background: var(--panel); color: var(--fg);
}
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h2 { margin: 0 0 14px; font-size: 18px; }
dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
dialog input, dialog textarea {
  width: 100%; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
dialog textarea { min-height: 90px; resize: vertical; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn.ghost { background: var(--bg); color: var(--fg); }
.btn.danger { background: var(--bg); color: var(--rec); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span id="status">待機中</span>
  <span id="wl"></span>
  <button id="menuBtn" aria-label="設定">⋯</button>
</header>
<div id="banner"></div>

<main id="log">
  <div class="empty" id="empty">「録音開始」を押すと<br>ここに文字起こしが流れます</div>
  <div id="segs"></div>
  <div id="interim"></div>
</main>
<button id="toBottom">↓ 最新へ</button>

<footer>
  <div class="row">
    <div id="speakers"></div>
    <button class="icon-btn" id="starBtn" aria-label="直前を重要にする">★</button>
    <button class="icon-btn" id="noteBtn" aria-label="メモを追加">📝</button>
  </div>
  <div class="row" id="noteRow">
    <input id="noteInput" placeholder="手入力メモ（例：SSO必須）" enterkeyhint="done">
    <button class="btn" id="noteAdd">追加</button>
  </div>
  <div class="row">
    <button id="recBtn">● 録音開始</button>
    <button id="sendBtn">差分を送る<small id="sendSub">新規 0 件</small></button>
  </div>
</footer>

<div id="toast"></div>

<dialog id="dlg">
  <h2>設定</h2>
  <label for="spkInput">話者ラベル（カンマ区切り・最大3つ）</label>
  <input id="spkInput">
  <label for="prefixInput">送信テキストの先頭に付ける指示（任意）</label>
  <textarea id="prefixInput" placeholder="例：以下は商談の文字起こしの続きです。要点・課題・要件を追記して"></textarea>
  <div class="dlg-actions">
    <button class="btn" id="saveSettings">保存</button>
    <button class="btn ghost" id="copyAll">全文コピー</button>
    <button class="btn ghost" id="shareAll">全文を共有</button>
    <button class="btn danger" id="newSession">新しい商談を始める</button>
    <button class="btn ghost" id="closeDlg">閉じる</button>
  </div>
  <p class="hint">データはこの端末のブラウザ内（localStorage）にのみ保存されます。音声は保存しません。<br>文字起こし処理はブラウザ標準の音声認識（iOSではApple）を利用します。</p>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const KEY = 'livescribe.v1';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- state ----------
  const fresh = (keep = {}) => ({
    segs: [], sentUpTo: 0, sendCount: 0, startedAt: null,
    speakers: keep.speakers || ['お客様', '自分'], spk: 0, prefix: keep.prefix || '',
  });
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  const fmt = (ts) => new Date(ts).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- UI helpers ----------
  const log = $('#log'), segsEl = $('#segs'), interimEl = $('#interim');
  let toastTimer;
  const toast = (msg) => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  };
  const banner = (msg) => { const b = $('#banner'); b.textContent = msg || ''; b.classList.toggle('show', !!msg); };

  const nearBottom = () => log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  const scrollBottom = () => { log.scrollTop = log.scrollHeight; };
  log.addEventListener('scroll', () => $('#toBottom').classList.toggle('show', !nearBottom()));
  $('#toBottom').onclick = scrollBottom;

  const segHTML = (seg, i) => {
    const note = seg.kind === 'note';
    const label = note ? '<span class="spk">📝</span>'
      : `<button class="spk s${seg.spk}" data-act="spk">${esc(S.speakers[seg.spk] ?? '?')}</button>`;
    return `<div class="seg${note ? ' note' : ''}${seg.star ? ' starred' : ''}" data-i="${i}">` + label +
      `<span class="txt"><span class="time">${fmt(seg.ts)}</span>${esc(seg.text)}</span>` +
      `<button class="star" data-act="star">★</button></div>`;
  };
  const dividerHTML = () => `<div class="divider">ここまで送信済み #${S.sendCount}</div>`;

  const renderAll = () => {
    const keep = nearBottom();
    let html = '';
    S.segs.forEach((seg, i) => {
      if (i === S.sentUpTo && S.sendCount > 0) html += dividerHTML();
      html += segHTML(seg, i);
    });
    if (S.sentUpTo === S.segs.length && S.sendCount > 0) html += dividerHTML();
    segsEl.innerHTML = html;
    $('#empty').style.display = S.segs.length ? 'none' : '';
    updSend();
    if (keep) scrollBottom();
  };
  const renderOne = (i) => {
    const el = segsEl.querySelector(`.seg[data-i="${i}"]`);
    if (el) el.outerHTML = segHTML(S.segs[i], i);
  };
  const appendSeg = (seg) => {
    const keep = nearBottom();
    S.segs.push(seg); save();
    segsEl.insertAdjacentHTML('beforeend', segHTML(seg, S.segs.length - 1));
    $('#empty').style.display = 'none';
    updSend();
    if (keep) scrollBottom();
  };
  const updSend = () => {
    const n = S.segs.length - S.sentUpTo;
    $('#sendSub').textContent = `新規 ${n} 件` + (S.sendCount ? ` / 送信済 #${S.sendCount}` : '');
    $('#sendBtn').disabled = n === 0;
  };

  segsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const i = +btn.closest('.seg').dataset.i, seg = S.segs[i];
    if (btn.dataset.act === 'spk') seg.spk = (seg.spk + 1) % S.speakers.length;
    if (btn.dataset.act === 'star') seg.star = !seg.star;
    save(); renderOne(i);
  });

  const renderSpeakers = () => {
    $('#speakers').innerHTML = S.speakers.map((n, i) =>
      `<button data-i="${i}" class="${i === S.spk ? 'active' : ''}">${esc(n)}</button>`).join('');
  };
  $('#speakers').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    S.spk = +b.dataset.i; save(); renderSpeakers();
  });

  $('#starBtn').onclick = () => {
    const i = S.segs.length - 1;
    if (i < 0) return toast('まだ発言がありません');
    S.segs[i].star = true; save(); renderOne(i); toast('★ 直前の発言を重要にしました');
  };
  $('#noteBtn').onclick = () => {
    const r = $('#noteRow'); r.classList.toggle('show');
    if (r.classList.contains('show')) $('#noteInput').focus();
  };
  const addNote = () => {
    const v = $('#noteInput').value.trim(); if (!v) return;
    appendSeg({ kind: 'note', ts: Date.now(), text: v, star: false });
    $('#noteInput').value = '';
  };
  $('#noteAdd').onclick = addNote;
  $('#noteInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addNote(); });

  // ---------- wake lock (画面を点けっぱなしにする) ----------
  let wakeLock = null;
  const updWL = () => {
    $('#wl').textContent = !('wakeLock' in navigator) ? '画面常時点灯: 非対応'
      : wakeLock ? '☀︎ 画面常時点灯中' : '';
  };
  const lockOn = async () => {
    if (!('wakeLock' in navigator) || wakeLock) return updWL();
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; updWL(); });
    } catch {}
    updWL();
  };
  const lockOff = async () => { try { await wakeLock?.release(); } catch {} wakeLock = null; updWL(); };

  // ---------- speech recognition ----------
  let running = false, rec = null, errStreak = 0, timer = null;
  let lastSegIdxThisRec = -1;

  const commit = (text) => {
    text = text.trim(); if (!text) return;
    // iOS は continuous 時に「前回の確定文＋続き」を返すことがあるので重複を吸収する
    const prev = S.segs[lastSegIdxThisRec];
    if (prev && prev.kind !== 'note') {
      if (text.startsWith(prev.text)) { prev.text = text; save(); renderOne(lastSegIdxThisRec); return; }
      if (prev.text.startsWith(text)) return;
    }
    appendSeg({ ts: Date.now(), spk: S.spk, text, star: false });
    lastSegIdxThisRec = S.segs.length - 1;
  };

  const startRec = () => {
    if (!running) return;
    const r = new SR();
    r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true;
    const done = new Set();
    let interim = '';
    lastSegIdxThisRec = -1;
    r.onresult = (e) => {
      errStreak = 0; interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i], t = res[0].transcript;
        if (res.isFinal) { if (!done.has(i)) { done.add(i); commit(t); } }
        else interim += t;
      }
      const keep = nearBottom();
      interimEl.textContent = interim;
      if (keep) scrollBottom();
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        banner('マイクまたは音声認識が許可されていません。設定 > Safari > マイク、および 設定 > Siri（音声入力）を確認してください。');
        stop();
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        errStreak++;
      }
    };
    r.onend = () => {
      if (interim) { commit(interim); interim = ''; }
      interimEl.textContent = '';
      if (rec === r) rec = null;
      if (running && document.visibilityState === 'visible') {
        if (errStreak >= 5) banner('音声認識が不安定です（ネットワークを確認してください）。自動で再試行しています…');
        setTimeout(startRec, Math.min(200 * 2 ** Math.max(0, errStreak - 1), 5000));
      }
    };
    try { r.start(); rec = r; } catch { setTimeout(startRec, 500); }
  };

  const tick = () => {
    if (!S.startedAt) return;
    const s = Math.floor((Date.now() - S.startedAt) / 1000);
    const hh = Math.floor(s / 3600), mm = String(Math.floor(s / 60) % 60).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
    $('#status').textContent = (running ? '録音中 ' : '一時停止 ') + (hh ? `${hh}:` : '') + `${mm}:${ss}`;
  };

  const start = () => {
    if (!SR) return banner('このブラウザは音声認識に対応していません。iPhone の Safari で開いてください。');
    banner('');
    running = true; errStreak = 0;
    if (!S.startedAt) { S.startedAt = Date.now(); save(); }
    $('#recBtn').textContent = '■ 一時停止'; $('#recBtn').classList.add('running');
    $('#dot').classList.add('on');
    lockOn(); startRec();
    clearInterval(timer); timer = setInterval(tick, 1000); tick();
  };
  function stop() {
    running = false;
    try { rec?.stop(); } catch {}
    $('#recBtn').textContent = '● 録音再開'; $('#recBtn').classList.remove('running');
    $('#dot').classList.remove('on');
    lockOff(); clearInterval(timer); tick();
  }
  $('#recBtn').onclick = () => (running ? stop() : start());

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      lockOn();
      if (!rec) startRec();
    }
  });

  // ---------- export / send ----------
  const buildText = (from, to, label) => {
    const segs = S.segs.slice(from, to);
    if (!segs.length) return '';
    const lines = [];
    let cur = null;
    const flush = () => {
      if (!cur) return;
      lines.push(`${cur.star ? '★' : ''}[${fmt(cur.ts)} ${S.speakers[cur.spk] ?? '?'}] ${cur.text}`);
      cur = null;
    };
    for (const seg of segs) {
      if (seg.kind === 'note') { flush(); lines.push(`${seg.star ? '★' : ''}📝[${fmt(seg.ts)} 手入力メモ] ${seg.text}`); continue; }
      if (cur && cur.spk === seg.spk && !cur.star && !seg.star && seg.ts - cur.last < 30000) {
        cur.text += ' ' + seg.text; cur.last = seg.ts;
      } else {
        flush(); cur = { ...seg, last: seg.ts };
      }
    }
    flush();
    const head = [
      S.prefix.trim(),
      `【商談文字起こし ${label}】${fmt(segs[0].ts)}〜${fmt(segs[segs.length - 1].ts)}`,
      '※音声認識の生テキスト（誤認識あり）。話者ラベルは手動切替のため不正確な場合あり。★=重要、📝=手入力メモ',
    ].filter(Boolean);
    return head.join('\n') + '\n\n' + lines.join('\n');
  };

  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  };

  // navigator.share → 共有シートで Slack を選んで DM 先を指定
  const shareOrCopy = async (text) => {
    if (navigator.share) {
      try { await navigator.share({ text }); return 'shared'; }
      catch (e) { if (e.name === 'AbortError') return null; }
    }
    return (await copy(text)) ? 'copied' : null;
  };

  $('#sendBtn').onclick = async () => {
    const to = S.segs.length, n = S.sendCount + 1;
    const text = buildText(S.sentUpTo, to, `#${n}`);
    if (!text) return toast('新しい内容はありません');
    const r = await shareOrCopy(text);
    if (!r) return;
    S.sentUpTo = to; S.sendCount = n; save(); renderAll();
    toast(r === 'shared' ? `#${n} を送信済みにしました` : `#${n} をコピーしました（Slack に貼り付けてください）`);
  };

  // ---------- settings ----------
  const dlg = $('#dlg');
  $('#menuBtn').onclick = () => {
    $('#spkInput').value = S.speakers.join(', ');
    $('#prefixInput').value = S.prefix;
    dlg.showModal();
  };
  $('#closeDlg').onclick = () => dlg.close();
  $('#saveSettings').onclick = () => {
    const sp = $('#spkInput').value.split(/[,、，]/).map((s) => s.trim()).filter(Boolean).slice(0, 3);
    if (sp.length) S.speakers = sp;
    if (S.spk >= S.speakers.length) S.spk = 0;
    S.segs.forEach((g) => { if (g.kind !== 'note' && g.spk >= S.speakers.length) g.spk = 0; });
    S.prefix = $('#prefixInput').value;
    save(); renderSpeakers(); renderAll(); dlg.close(); toast('保存しました');
  };
  $('#copyAll').onclick = async () => {
    const text = buildText(0, S.segs.length, '全文');
    if (!text) return toast('内容がありません');
    toast((await copy(text)) ? '全文をコピーしました' : 'コピーに失敗しました');
  };
  $('#shareAll').onclick = async () => {
    const text = buildText(0, S.segs.length, '全文');
    if (!text) return toast('内容がありません');
    await shareOrCopy(text);
  };
  $('#newSession').onclick = () => {
    if (!confirm('現在の文字起こしを端末から削除して、新しい商談を始めますか？')) return;
    if (running) stop();
    S = fresh({ speakers: S.speakers, prefix: S.prefix });
    save(); renderSpeakers(); renderAll(); interimEl.textContent = '';
    $('#status').textContent = '待機中'; dlg.close(); toast('新しい商談を開始できます');
  };

  // ---------- init ----------
  if (!SR) banner('このブラウザは音声認識に対応していません。iPhone の Safari で開いてください。');
  if (S.segs.length) { $('#recBtn').textContent = '● 録音再開'; tick(); }
  renderSpeakers(); renderAll(); updWL();
})();
</script>
</body>
</html>
